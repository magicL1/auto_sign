name: Juejin daily automation

on:
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:
    inputs:
      execute:
        description: "正式执行账户操作（关闭时仅演练）"
        required: true
        type: boolean
        default: false

concurrency:
  group: juejin-daily-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JUEJIN_COOKIE: ${{ secrets.JUEJIN_COOKIE }}
      EXECUTE: ${{ github.event_name == 'schedule' || inputs.execute == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run checks
        run: npm test && npm run check

      - name: Run automation
        id: automation
        continue-on-error: true
        run: npm start

      - name: Update failure log
        if: always() && steps.automation.outcome == 'failure'
        run: node scripts/record-failure.js

      - name: Commit failure log
        if: always() && steps.automation.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FAILURES.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record automation failure"
          git push

      - name: Mark workflow as failed
        if: always() && steps.automation.outcome == 'failure'
        run: exit 1
